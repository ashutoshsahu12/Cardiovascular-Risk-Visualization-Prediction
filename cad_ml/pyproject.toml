[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cadml"
version = "1.0.0"
description = "Leakage-safe CAD / LAD / LCX / RCA stenosis prediction pipeline"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "xgboost", "catboost", "scipy", "joblib", "openpyxl", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
